[workspace]
resolver = "3"
members = ["core", "pane", "runner"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Crates opt in with `[lints] workspace = true`. clippy.toml lets tests
# unwrap, expect and panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
