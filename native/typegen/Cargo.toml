[package]
name = "cockpit_typegen"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Writes the panel model's Swift types, with a Decodable that reads serde_json's shapes"

[lints]
workspace = true

[dependencies]
cockpit_core = { path = "../core" }
# The same exact pin as native/core's, for the generator's type bound.
facet = "=0.46.5"
facet_generate = { version = "0.19", default-features = false, features = ["swift"] }
heck = "0.5"

[dev-dependencies]
serde_json = "1.0.151"
