[package]
name = "cockpit_runner"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The cockpit's live-data runner: reads cmux, Agent View and the config files and drives the core, for any front end"

[lints]
workspace = true

[[bin]]
name = "cockpit-publish"
path = "src/bin/cockpit-publish.rs"

[dependencies]
cockpit_core = { path = "../core" }
crux_core = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
