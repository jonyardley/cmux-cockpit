# The helper app with the Cockpit sidebar extension embedded. Generate the
# Xcode project with `xcodegen` after ./fetch-sdk.sh; ./build.sh does both.
name: Cockpit
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9S5FG4LQAF
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CmuxExtensionKit:
    path: .sdk/Packages/macOS/CmuxExtensionKit
targets:
  # Unsandboxed, no Dock icon. Building it builds and embeds the extension.
  Cockpit:
    type: application
    platform: macOS
    sources: [Host, Shared]
    dependencies:
      - target: CockpitSidebar
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Embed cockpit-publish
        # The helper starts it from Contents/MacOS. Built with cargo in the
        # configuration's profile, copied in, and signed with the app's
        # identity and entitlements (the App Group) when the build signs:
        # an unsigned binary inside would break the app's seal. Unsandboxed
        # (below): cargo writes native/target and codesign reads the
        # keychain.
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ "$CONFIGURATION" = Release ]; then profile=release; flag=--release; else profile=debug; flag=; fi
          (cd "$SRCROOT/.." && cargo build -q $flag -p cockpit_runner --bin cockpit-publish)
          out="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/cockpit-publish"
          cp "$SRCROOT/../target/$profile/cockpit-publish" "$out"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp=none \
              --entitlements "$SRCROOT/Host/Host.entitlements" \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$out"
          fi
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/cockpit-publish
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jonyardley.cockpit
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Cockpit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: Host/Host.entitlements
  # The sandboxed sidebar cmux hosts through ExtensionKit.
  CockpitSidebar:
    type: extensionkit-extension
    platform: macOS
    sources:
      - Sidebar
      - Shared
      # The panel model's Swift types, written from the Rust ones by
      # native/typegen in the step below; gitignored, never committed.
      # Optional so XcodeGen accepts a fresh clone before the first build.
      - path: Generated/PanelTypes.swift
        optional: true
    preBuildScripts:
      - name: Generate the panel types
        # Xcode's PATH leaves out rustup's folder. Runs under Xcode's
        # script sandbox, which only walls off native/mac and the build
        # folders: cargo works in native/ and ~/.cargo, outside it, and
        # its one write here is the declared output.
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/.." && cargo run -q -p cockpit_typegen
        outputFiles:
          - $(SRCROOT)/Generated/PanelTypes.swift
        basedOnDependencyAnalysis: false
    dependencies:
      - package: CmuxExtensionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jonyardley.cockpit.sidebar
        PRODUCT_NAME: CockpitSidebar
        INFOPLIST_FILE: Sidebar/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sidebar/Sidebar.entitlements
        CMUX_SIDEBAR_EXTENSION_POINT_ID: com.cmuxterm.app.cmux.sidebar
        ENABLE_USER_SCRIPT_SANDBOXING: YES
