name: PR description

# Separate from CI so editing the description reruns only this check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Queue rather than cancel: a push and a description edit arrive together,
# and a cancelled run shows as a red check on the PR.
concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-body:
    # Drafts are skipped, not failed: every PR opens with its review still
    # to come, and a red check on each new PR taught nobody anything. Going
    # ready runs it, and the guard-ready hook checks the same rules before
    # an agent's `gh pr ready`. Dependabot writes its own descriptions; a
    # title-only edit cannot change the result. `changes.body` is tested for
    # truthiness: comparing an object with `!= null` coerces both to numbers
    # and comes out false.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/pr-body.ts
