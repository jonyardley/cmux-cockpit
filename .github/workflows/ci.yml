name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, since a tag can be moved under us.
# Dependabot keeps the SHAs and the trailing version comments current.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp config/projects.example.json config/projects.json
      # Lint, types, dead code, build, tests with a coverage floor.
      # `cmux sidebar validate` needs the macOS app, so it runs in the
      # pre-commit hook on main only.
      - run: npm run check
      # Network bound, so CI only rather than the pre-commit hook.
      - run: npm audit --audit-level=high
