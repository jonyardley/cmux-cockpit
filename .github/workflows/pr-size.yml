name: PR size

# Fails a PR over 800 added lines (lock files, fixtures, snapshots and
# generated files left out) unless its description has a "## Size" section
# saying why. Separate from CI so a description edit reruns only this and
# the PR description check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-size:
    # Runs on drafts too, unlike the PR description check: the size is
    # known when the draft opens, which is when splitting is cheapest. An
    # edit reruns it when the description or the base branch changed.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.body || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Depth 2: the merge commit and its first parent, the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/pr-size.ts
